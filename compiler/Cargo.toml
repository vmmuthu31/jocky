[package]
name = "jocky-compiler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jocky-compile"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
ml-kem = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tree-sitter = "0.27.0"
tree-sitter-traversal = "0.1.2"
