[package]
name = "jocky-compiler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jocky-compile"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tree-sitter = "0.27.0"
tree-sitter-traversal = "0.1.2"
