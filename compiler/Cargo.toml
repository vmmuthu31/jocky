[package]
name = "jocky-compiler"
version = "1.0.0"
edition = "2021"
description = "JOCKY Enterprise Digital Forensics Platform — DSL compiler"
homepage = "https://github.com/vmmuthu31/jocky"
repository = "https://github.com/vmmuthu31/jocky"
license = "MIT"

[package.metadata.deb]
name = "jocky"
maintainer = "NTRO JOCKY Team <vmmuthu20000@gmail.com>"
copyright = "2026 NTRO Hackathon 26148"
license-file = ["../LICENSE", "0"]
extended-description = """\
JOCKY is an enterprise-grade digital forensics platform for authorized \
computer and network forensic analysis under IT Act 2000 Section 69.\
"""
section = "utils"
priority = "optional"
assets = [
  ["target/release/jocky-compile", "usr/bin/", "755"],
  ["../README.md", "usr/share/doc/jocky/", "644"],
  ["../examples/", "usr/share/jocky/examples/", "644"],
]

[[bin]]
name = "jocky-compile"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
ml-kem = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tree-sitter = "0.27.0"
tree-sitter-traversal = "0.1.2"

[package.metadata.generate-rpm]
name = "jocky"
license = "MIT"
summary = "JOCKY Enterprise Digital Forensics Platform"
url = "https://github.com/vmmuthu31/jocky"

[[package.metadata.generate-rpm.assets]]
source = "target/release/jocky-compile"
dest = "/usr/bin/jocky-compile"
mode = "755"
