name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: jocky-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: jocky-linux-arm64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: jocky-windows-x86_64.exe
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: jocky-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: jocky-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for ARM Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: '!matrix.cross'
        working-directory: compiler
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        working-directory: compiler
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp compiler/target/${{ matrix.target }}/release/jocky-compile \
             ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp compiler/target/${{ matrix.target }}/release/jocky-compile.exe `
             ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            ## JOCKY ${{ github.ref_name }}

            Enterprise Digital Forensics Platform — NTRO Hackathon 26148

            ### Install

            **macOS / Linux (curl)**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/vmmuthu31/jocky/main/install.sh | sh
            ```

            **Windows (PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/vmmuthu31/jocky/main/install.ps1 | iex
            ```

            ### Downloads

            | Platform | Binary |
            |----------|--------|
            | macOS (Apple Silicon) | `jocky-macos-arm64` |
            | macOS (Intel) | `jocky-macos-x86_64` |
            | Linux x86_64 | `jocky-linux-x86_64` |
            | Linux ARM64 | `jocky-linux-arm64` |
            | Windows x86_64 | `jocky-windows-x86_64.exe` |

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        working-directory: compiler
        run: cargo test
        env:
          JOCKY_ALLOW_DEV_KEY: "1"
      - name: Go tests
        working-directory: server
        run: go test ./...
